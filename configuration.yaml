# General Configuration
model:
  name: "gazemoe_dinov2_vitl14_inout"  # train_goo-depthaware: gazemoe_dinov2_vitl14_inout | gazelle_dinov2_vit{b,l}14{_inout}
  pretrained_path: ""  # "pretrainMoE_MSF1_best.pt" or "gazemoe_gt3d_gf.pt" or ; "" → from scratch
  mlp_ratio: 1  # hidden_dim = ( ) * in_feats, ratio between FFN dim and input feature size [1, 2, 4]
  num_experts: 4  # Routed experts [3, 4, 6]
  num_shared_experts: 1  # Shared experts [1, 2]
  top_k: 2  # [1, 2]
  moe_type: "moe"  # vanilla / shared / else (moe)
  is_msf: 1  # [2, 3, 4, 5]
  is_focal_loss: 1  # if using FocalLoss for class balancing
  pbce_loss: "bce"  #"mse" or "bce" or "hybrid"
  reduction: "mean"  #"mean" or "none"
  bce_weight: 0.0  # 0.1 for ChildPlay; disable for GOO(?) and GazeFollow
  mse_weight: 1.0
  depth_weight: 0.5  # Legacy !
  depth_weight_start: 0.5  # GazeFollow pretrain: linear schedule → depth_weight_end
  depth_weight_end: 0.1
  angle_weight: 0.0  # 0.05 / 0.1
  vec_weight: 0.0
  kld_weight: 0.0  # 0.01, 0.02, 0.05, 0.1 [0.0, 0.02, 0.05, 0.1]
  encoder:
    type: "DINOv2"   # backbone: DINOv2, ViT-B/16, ViT-L/14
    pretrained: true                # Use pretrained weights
  decoder:
    hidden_size: 256                # d_model [256, 384]
    depth: 3                        # Number of transformer layers in the decoder (default 3) [3, 4]
    num_heads: 8                    # Number of attention heads
    dropout: 0.1                    # Dropout rate
  depth_loss: "si_log"  # log_huber vs. si_log
  lambda_si: 0.5     # 0.0 ≡ log-MSE; 1.0 ≡ pure variance-of-d; 0.5 ≡ Eigen recommended
  use_refine: True
  refine_cond: "scalar"   # "scalar" (1-ch log-ratio) | "pair" (2-ch log z_g/z_h) | "dense" (low-rank dense feat)
  num_refine_layers: 2
  dense_depth_dim: 32     # only used when refine_cond == "dense"

  # --- Depth-aware GazeFollow pretraining (train_gazefollow-depthaware.py) ---
  # The depth-aware trainer uses *plain GazeMoE* (no depth heads at all)
  # plus ONE composite auxiliary loss:
  #     L_aux = (1 − cos((pred_xy − head_c), (gt_xy − head_c)))     ← 2-D angular
  #           + aux_3d_depth_weight · |d_pred − d_gt|               ← depth-coherence
  # where (pred_xy, d_pred) are expectations under the heatmap probability
  # and d_pred / d_gt are bilinearly sampled from the GT DA2 depth map.
  # Scale-invariant in normalised (x, y, depth) ∈ [0, 1]³; NOT a rigid 3-D
  # angle.  No depth prediction; the model outputs only the heatmap at
  # inference and no .npy is needed at deploy time.
  # Finetune-mode defaults (warm-started from pretrainMoE_MSF1_best.pt):
  # keep the auxiliary signal small and ramp it slowly so the GazeMoE
  # 2-D basin is preserved before depth coherence is enforced.
  w_aux_3d:             0.04  # overall weight on L_aux (small ⇒ BCE dominates)
  aux_3d_warmup_epochs: 3     # linear warmup of w_aux from 0 over the first N epochs
  aux_3d_depth_weight:  1.0   # internal balance of depth-coherence vs 2-D angular
  aux_3d_temperature: null    # null → use sigmoid heatmap as probability;
                              # set a float (e.g. 0.05) for a sharper softmax attention
  gauss_hm_sigma: 0.0  # if 0.0 then using depthaware heatmap; or use Gaussian heatmap with sigma =
  # --- GT3D heads (consumed only by train_depth_goo.py / train_depth_gazefollow.py) ---
  # These toggles are unused by the simplified depth-aware GazeFollow trainer
  # above; left here so other depth-aware scripts can still find them.
  use_anchored_depth: True
  use_dense_depth:    True

data:
  input_resolution: 448
  train_path: "./VAT"     # Path to preprocessed training dataset
  test_path: "./VAT"       # Path to preprocessed test dataset
  pre_train_path: "./gazefollow_extended"
  pre_test_path: "./gazefollow_extended"
  goo_path: "../GOOSynthV3"
  goo_real_path: ""   # dir containing gooreal_test_preprocess.json; set "../GOORealV3" OR "" to disable
  depth_dir: "depth"  # sub-folder under {train,test,goo,...}_path holding cached DA2 .npy maps
  # [["crop"], ["crop", "photometric"], ["crop", "rotation"], ["crop", "photometric", "rotation"]]
  augmentations: ["crop", "photometric"]

train:
  # VAT finetuning hyperparams
  batch_size: 60                    # Batch size for training
  epochs: 8                    # Number of finetuning epochs
  # 0.00001 for VAT; 0.0001 for ChildPlay 
  lr: 0.00001                         # heatmap_head, refined_heatmap_head, pos_embed
  inout_lr: 0.001
  depth_lr: 0.00001                  
  fuse_lr: 0.00001
  block_lr: 0.00001
  layer_decay: 0                    # 0 or 1
  optimizer: "AdamW"                # Optimizer type (adam, adamw, sgd, etc.)
  weight_decay: 0.01                # Weight decay for optimizer
  lr_scheduler:                     # Learning rate scheduler settings
    type: "cosine"                  # cosine / linear / warmup (for warmup training)
    step_size: 15                   # Step size for step scheduler / warmup: warmup_epochs
    gamma: 0.1                      # Decay factor for step/exponential scheduler
    min_lr: 1e-7                    # Minimum learning rate for cosine/other schedulers
  gradient_clipping: 5.0            # Gradient clipping threshold
  # Depth-aware GazeFollow finetune (warm-start from pretrainMoE_MSF1_best.pt).
  # LR is ~10x lower than the from-scratch pretrain since the 2-D basin is
  # already won; we only nudge the network toward depth coherence.
  pre_lr: 0.0001
  pre_fuse_lr: 0.0001
  pre_block_lr: 0.0001
  pre_batch_size: 60
  pre_epochs: 25
  pre_optimizer: "AdamW"
  pre_weight_decay: 0.01  # only for AdamW
  # Staged DINOv2: 0 = train last N blocks from epoch 0; else unfreeze at this 0-based epoch index
  backbone_unfreeze_start_epoch: 1000  # Stop unfreezing Backbone
  backbone_train_last_blocks: 4
  pre_backbone_lr: 0.000005
  pre_lr_scheduler:
    type: "warmup_cosine"           # warmup_cosine | cosine | warmup | StepLR-compatible keys
    warmup_epochs: 2                # finetune-mode: short LR warmup
    step_size: 8                    # used by cosine / step branches only
    gamma: 0.1
    min_lr: 1e-7

eval:
  checkpoint: ""                    # Path to the checkpoint for Eval
  batch_size: 60                    # Batch size for evaluation

inference:
  checkpoint: ""

logging:
  log_dir: "results/gazemoe-gt3d-abla_/"                        # auto naming for GT3D finetune
  pre_dir: "results/pretrain_gazemoe-gt3d-abla_w4e-2/"   # depth-aware GazeFollow pretrain
  save_every: 5

hardware:
  device: "cuda:0"                    # Device to use (cuda, cpu)
  num_workers: 3                    # Number of data loader workers
  pin_memory: True                  # Pin memory for faster data loading
